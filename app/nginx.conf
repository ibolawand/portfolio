server {
    listen 8080;
    server_name _;

    # Verhindert, dass Nginx den internen Port 8080 in Redirects schreibt
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's built-in DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Chat backend
    location /api/ {
        set $chat_api http://chat-api:3000;
        proxy_pass $chat_api$request_uri;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 16k;
    }

    # Astro's hashed build assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pages / Routing
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
        expires -1;
    }
}